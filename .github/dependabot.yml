version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "primevue"
        versions: [ ">=5.0.0" ]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5